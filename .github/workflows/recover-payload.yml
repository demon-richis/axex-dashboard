name: One-time source recovery

on:
  push:
    branches:
      - saas/compact-copy-radix-motion

permissions:
  contents: write

jobs:
  restore:
    if: startsWith(github.event.head_commit.message, 'Stage source recovery payload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and verify complete source
        shell: bash
        run: |
          set -euo pipefail
          cat .axex-payload/chunk-* | base64 --decode | tar -xz
          rm -rf .axex-payload
          rm .github/workflows/recover-payload.yml
          npm ci
          npm run check
          npm test
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete Axex landing page source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
